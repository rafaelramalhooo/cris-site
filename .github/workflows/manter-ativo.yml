# Chama o banco duas vezes por semana para que o Supabase (plano gratuito)
# não "adormeça" por falta de uso. Não precisa de nenhuma senha: usa só o
# endereço e a chave PÚBLICA que já estão em docs/config.js.
name: Manter o banco ativo

on:
  schedule:
    - cron: '17 9 * * 1,4'   # segundas e quintas, 09h17 UTC
  workflow_dispatch:          # permite rodar manualmente (aba Actions)

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chamar o banco
        run: |
          URL=$(grep -o "SUPABASE_URL: *'[^']*'" docs/config.js | sed "s/.*'\(.*\)'/\1/")
          KEY=$(grep -o "SUPABASE_KEY: *'[^']*'" docs/config.js | sed "s/.*'\(.*\)'/\1/")
          case "$URL" in https://*.supabase.co) ;; *) echo "config.js ainda não foi preenchido"; exit 1;; esac
          RESP=$(curl -fsS --retry 3 --max-time 30 -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Resposta: $RESP"
          [ "$RESP" = '"ok"' ]
